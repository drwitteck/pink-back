name: Deploy web app to Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run logic tests
        run: node web/test.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Stamp the service worker cache with this commit
        run: |
          sed -i "s|const CACHE = '[^']*';|const CACHE = 'zep-${GITHUB_SHA}';|" web/sw.js
          grep -q "const CACHE = 'zep-${GITHUB_SHA}';" web/sw.js || {
            echo "::error file=web/sw.js::Cache stamping failed - the CACHE line no longer matches the expected pattern, so this deploy would ship a stale cache name."
            exit 1
          }
          echo "Stamped cache: zep-${GITHUB_SHA}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
